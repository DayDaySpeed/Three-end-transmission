<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>局域网互传 · LanRoom</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/platform.css" />
</head>
<body>
  <div id="app">
    <!-- 首次进入：设置昵称 -->
    <section id="join-screen" class="screen">
      <div class="card join-card">
        <span id="platform-badge" class="platform-badge"></span>
        <h1>LanRoom</h1>
        <p class="subtitle">局域网聊天式互传 · 浏览器打开即用</p>
        <label for="device-name">你的设备名称</label>
        <input id="device-name" type="text" placeholder="例如：小明的 Android" maxlength="32" />
        <button id="join-btn" type="button">进入聊天室</button>
        <button id="show-info-btn" type="button" class="link-btn">查看连接地址 / 二维码</button>
      </div>
    </section>

    <!-- 主界面 -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <section id="chat-screen" class="screen hidden">
      <aside class="sidebar" id="sidebar">
        <header class="sidebar-header">
          <h2>在线设备</h2>
          <span id="online-count" class="badge">0</span>
        </header>
        <ul id="device-list"></ul>
        <div class="sidebar-footer">
          <button id="info-panel-btn" type="button">连接信息</button>
          <button id="leave-btn" type="button" class="danger">离开</button>
        </div>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <div class="chat-header-left">
            <button id="toggle-devices-btn" type="button" class="icon-btn header-devices-btn" title="在线设备">👥</button>
            <div>
              <h2>群聊</h2>
              <p id="self-label" class="self-label"></p>
            </div>
          </div>
          <div class="chat-header-actions">
            <span id="conn-status" class="status offline">未连接</span>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <footer class="composer">
          <input id="file-input" type="file" multiple hidden />
          <button id="attach-btn" type="button" title="发送文件">📎</button>
          <textarea id="message-input" rows="1" placeholder="输入消息…"></textarea>
          <button id="send-btn" type="button">发送</button>
        </footer>
      </main>
    </section>

    <!-- 连接信息弹层 -->
    <dialog id="info-dialog">
      <div class="dialog-body">
        <h3>连接本聊天室</h3>
        <p class="hint">Android 请扫左侧 <strong>局域网 IP</strong> 码；iOS 可扫右侧 <strong>.local</strong> 码（IP 变了也能用）。</p>
        <div id="url-list" class="url-list"></div>
        <div class="qr-grid">
          <div class="qr-card">
            <p class="qr-platform">🤖 Android</p>
            <img id="qr-android" class="qr-image" alt="Android 加入二维码" width="180" height="180" />
            <p class="qr-caption">局域网 IP · 通用</p>
            <p id="qr-android-url" class="qr-url"></p>
          </div>
          <div class="qr-card" id="qr-ios-card">
            <p class="qr-platform">📱 iOS</p>
            <img id="qr-ios" class="qr-image" alt="iOS 加入二维码" width="180" height="180" />
            <p class="qr-caption">.local · 动态 IP 友好</p>
            <p id="qr-ios-url" class="qr-url"></p>
          </div>
        </div>
        <button id="close-info-btn" type="button">关闭</button>
      </div>
    </dialog>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
