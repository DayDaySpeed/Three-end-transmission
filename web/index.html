<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>局域网互传 · LanRoom</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/platform.css" />
</head>
<body>
  <div id="app">
    <!-- 首次进入：设置昵称 -->
    <section id="join-screen" class="screen">
      <div class="card join-card">
        <span id="platform-badge" class="platform-badge"></span>
        <h1>LanRoom</h1>
        <p class="subtitle">局域网聊天式互传 · 浏览器打开即用</p>
        <label for="device-name">你的设备名称</label>
        <input id="device-name" type="text" placeholder="例如：小明的 Android" maxlength="32" />
        <div id="pin-row" class="pin-row hidden">
          <label for="pin-input">房间口令</label>
          <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="向 Hub 管理者索取" maxlength="64" />
        </div>
        <button id="join-btn" type="button">进入聊天室</button>
        <button id="show-info-btn" type="button" class="link-btn">查看连接地址 / 二维码</button>
      </div>
    </section>

    <!-- 主界面 -->
    <section id="chat-screen" class="screen hidden">
      <!-- 遮罩必须在 #chat-screen 内：移动端 #chat-screen 是 position:fixed（独立层叠上下文），
           放在外面时 z-index 会盖住整个聊天界面，包括抽屉里的设备列表 -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
      <aside class="sidebar" id="sidebar">
        <header class="sidebar-header">
          <h2>在线设备</h2>
          <span id="online-count" class="badge">0</span>
        </header>
        <p id="dm-hint" class="dm-hint hidden">点其他设备可私聊</p>
        <ul id="device-list"></ul>
        <div class="sidebar-footer">
          <button id="info-panel-btn" type="button">连接信息</button>
          <button id="leave-btn" type="button" class="danger">离开</button>
        </div>
      </aside>

      <main class="chat-main" id="chat-main">
        <header class="chat-header">
          <div class="chat-header-left">
            <button id="toggle-devices-btn" type="button" class="icon-btn header-devices-btn" title="在线设备 / 私聊">👥<span id="peer-count" class="peer-count hidden"></span></button>
            <div>
              <h2 id="chat-title">群聊</h2>
              <p id="self-label" class="self-label"></p>
            </div>
          </div>
          <div class="chat-header-actions">
            <button id="copy-chat-btn" type="button" class="icon-btn" title="复制全部聊天记录">📋</button>
            <span id="conn-status" class="status offline">未连接</span>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <div id="drop-overlay" class="drop-overlay hidden">
          <div class="drop-overlay-inner">松开发送到 <span id="drop-target">群聊</span></div>
        </div>

        <footer class="composer">
          <div id="target-bar" class="target-bar hidden">
            <span>发送给：<strong id="target-name"></strong><span id="target-offline" class="target-offline hidden">（离线）</span></span>
            <button id="target-clear" type="button" class="target-clear" title="改回群发">✕ 群发</button>
          </div>
          <input id="file-input" type="file" multiple hidden />
          <button id="attach-btn" type="button" title="发送文件">📎</button>
          <textarea id="message-input" rows="1" placeholder="输入消息…"></textarea>
          <button id="send-btn" type="button">发送</button>
        </footer>
      </main>
    </section>

    <!-- 连接信息弹层 -->
    <dialog id="info-dialog">
      <div class="dialog-body">
        <h3>连接本聊天室</h3>
        <p class="hint">同一 WiFi 下的设备请扫下方二维码，或手动输入局域网 IP 地址。</p>
        <div id="url-list" class="url-list"></div>
        <div class="qr-single">
          <div class="qr-card">
            <img id="qr-join" class="qr-image" alt="加入二维码" width="200" height="200" />
            <p class="qr-caption">局域网 IP · 全平台通用</p>
            <p id="qr-join-url" class="qr-url"></p>
          </div>
        </div>
        <button id="close-info-btn" type="button">关闭</button>
      </div>
    </dialog>

    <!-- 图片大图预览 -->
    <dialog id="image-viewer" class="image-viewer">
      <img id="image-viewer-img" alt="图片预览" />
      <div class="image-viewer-actions">
        <button id="image-viewer-download" type="button">下载</button>
        <button id="image-viewer-close" type="button" class="secondary">关闭</button>
      </div>
    </dialog>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
