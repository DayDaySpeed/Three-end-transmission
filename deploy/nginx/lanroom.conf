# LanRoom 公网部署：Nginx 反向代理 + HTTPS
# 1. 把 drop.example.com 换成你的域名（共 4 处）
# 2. 申请证书：sudo certbot certonly --nginx -d drop.example.com
# 3. 放到 /etc/nginx/conf.d/lanroom.conf（或 sites-available 后软链），然后 sudo nginx -t && sudo systemctl reload nginx
#
# Hub 需要：LANROOM_LISTEN=127.0.0.1:8787  LANROOM_TRUSTED_PROXIES=127.0.0.1,::1
#          LANROOM_PUBLIC_URL=https://drop.example.com  LANROOM_PIN=<足够长的口令>

# WebSocket 升级：有 Upgrade 头时转发 upgrade，否则保持普通 keep-alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name drop.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # Nginx < 1.25.1 不支持此指令：删掉它，改成 listen 443 ssl http2;
    server_name drop.example.com;

    ssl_certificate     /etc/letsencrypt/live/drop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drop.example.com/privkey.pem;

    # 单文件上限由 Hub（LANROOM_MAX_UPLOAD_MB）控制；续传分片 8 MiB
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Hub 用 Host 校验 WebSocket 的 Origin，必须原样透传
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 用 $remote_addr 覆盖而不是追加，客户端伪造的 X-Forwarded-For 不会传进去
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件边收边写 / 边读边发，不在 Nginx 落盘缓冲
        proxy_request_buffering off;
        proxy_buffering off;

        # 慢速网络上传一个分片、以及长时间空闲的 WebSocket（Hub 每 54s ping 一次）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
