# Linux 宿主机网络模式（推荐长期使用 myarch.local）
# 启动：LANROOM_HOSTNAME=myarch docker compose -f docker-compose.host.yml up -d --build
#
# 首次部署建议在宿主机执行: sudo ./deploy/setup-host-mdns.sh
# 注意：Mac/Windows Docker Desktop 不支持 host 网络。

services:
  lanroom:
    build: .
    image: lanroom:latest
    container_name: lanroom
    restart: unless-stopped
    network_mode: host
    environment:
      LANROOM_UPLOAD_DIR: /data/uploads
      LANROOM_HOSTNAME: ${LANROOM_HOSTNAME:-myarch}
      LANROOM_ADVERTISE_IP: ${LANROOM_ADVERTISE_IP:-}
      # 单文件上传上限（MiB），默认 500，最大 4096
      LANROOM_MAX_UPLOAD_MB: ${LANROOM_MAX_UPLOAD_MB:-}
    volumes:
      - lanroom-uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lanroom-uploads:
