# Linux 宿主机网络模式（可选）
# 用于 mDNS（.local）与容器直接使用宿主机网卡 IP
# 启动：docker compose -f docker-compose.host.yml up -d --build
#
# 注意：network_mode: host 下 ports 映射无效；Mac/Windows Docker Desktop 不支持 host 网络。

services:
  lanroom:
    build: .
    image: lanroom:latest
    container_name: lanroom
    restart: unless-stopped
    network_mode: host
    environment:
      LANROOM_UPLOAD_DIR: /data/uploads
    volumes:
      - lanroom-uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lanroom-uploads:
