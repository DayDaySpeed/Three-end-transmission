# LanRoom 一键部署
# 启动：docker compose up -d --build
# 访问：http://<宿主机局域网 IP>:8787

services:
  lanroom:
    build: .
    image: lanroom:latest
    container_name: lanroom
    restart: unless-stopped
    ports:
      - "${LANROOM_PORT:-8787}:8787"
    environment:
      LANROOM_UPLOAD_DIR: /data/uploads
      # 可选：Bridge 模式下指定宿主机局域网 IP
      LANROOM_ADVERTISE_IP: ${LANROOM_ADVERTISE_IP:-}
      LANROOM_MAX_UPLOAD_MB: ${LANROOM_MAX_UPLOAD_MB:-}
      # 可选：消息与文件保留时长（如 30m、24h），默认 1h
      LANROOM_RETENTION: ${LANROOM_RETENTION:-}
      # 可选：房间口令，设置后新设备需输入口令才能加入
      LANROOM_PIN: ${LANROOM_PIN:-}
    volumes:
      - lanroom-uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lanroom-uploads:
